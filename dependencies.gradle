dependencies {

    api("com.github.GTNewHorizons:GTNHLib:0.11.52:dev")

    // zstd-jni is shaded into the mod jar, unrelocated and unminimized.
    // See the matching notes next to usesShadowedDependencies in gradle.properties.
    // 1.5.7-5 is the newest release that is still a plain (non multi-release) Java 8 artifact,
    // which is what LaunchWrapper can load reliably; later builds ship a JDK22 Panama variant.
    shadowImplementation("com.github.luben:zstd-jni:1.5.7-5")

    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.155-GTNH:dev")

    // jvmDowngrader
    compileOnly("javax.xml.bind:jaxb-api:2.3.1")
    compileOnly("org.jetbrains:annotations:26.0.1")
}

configurations.configureEach {
    exclude group: "com.github.GTNewHorizons", module: "CodeChickenLib"
    exclude group: "com.github.GTNewHorizons", module: "Hodgepodge"
    exclude group: "com.github.GTNewHorizons", module: "Baubles"
}
